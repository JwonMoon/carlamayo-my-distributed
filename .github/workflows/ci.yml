name: CI

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            pytest \
            numpy \
            scipy \
            pillow \
            opencv-python-headless \
            grpcio grpcio-tools grpcio-health-checking protobuf \
            psutil nvidia-ml-py pandas matplotlib
          # The simulator-free tests exercise the version dispatcher, adapters,
          # shared helpers, dataset loading, the launcher parser, the gRPC
          # client/server round trip (with a fake adapter) and the loops against
          # an in-memory CARLA stand-in. Adapters import their Alpamayo model
          # package lazily inside load_model, so no model submodule is needed.

      - name: Check generated gRPC stubs are up to date
        run: |
          tools/gen_proto.sh
          git diff --exit-code -- module/remote/alpamayo_inference_pb2.py module/remote/alpamayo_inference_pb2_grpc.py \
            || (echo "Regenerate stubs with tools/gen_proto.sh and commit them" && exit 1)

      - name: Run lightweight tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests
