name: CI

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            pytest \
            numpy \
            scipy \
            pillow \
            opencv-python-headless
          # The simulator-free tests exercise the version dispatcher, adapters,
          # shared helpers, dataset loading, and the launcher parser. Adapters
          # import their Alpamayo model package lazily inside load_model, so no
          # model submodule needs installing here.

      - name: Run lightweight tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests
