[project]
name = "carlamayo"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "einops>=0.8.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "pandas>=2.3.3",
  "physical-ai-av==0.2.0",
  "pillow>=12.0.0",
  "torch==2.8.0",
  "torchvision>=0.23.0",
  "transformers==4.57.1",
  "flash-attn>=2.8.3",
  "matplotlib>=3.10.7",
  "seaborn>=0.13.2",
  # Remote inference server + profiling (docs/distributed-architecture.md).
  "grpcio>=1.60",
  "grpcio-health-checking>=1.60",
  "protobuf>=5.26",
  "psutil>=5.9",
  "nvidia-ml-py>=12.0",
]

[dependency-groups]
dev = [
  "mediapy>=1.2.4",
  "ipykernel>=6.29.3",
  "ipywidgets>=8.1.8",
  "pre-commit>=4.5.1",
  "pytest>=8.0.0",
  "grpcio-tools>=1.60",
]

[tool.uv]
package = false
no-build-isolation-package = ["flash-attn"]

[tool.ruff]
line-length = 100
